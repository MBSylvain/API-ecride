services:
  - type: web
    name: mon-api-php
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DB_HOST
        fromService:
          type: mysql
          name: mon-mysql
          property: host
      - key: DB_USER
        fromService:
          type: mysql
          name: mon-mysql
          property: user
      - key: DB_PASSWORD
        fromService:
          type: mysql
          name: mon-mysql
          property: password
      - key: DB_NAME
        fromService:
          type: mysql
          name: mon-mysql
          property: database

databases:
  - name: mon-mysql
    type: mysql
    plan: free